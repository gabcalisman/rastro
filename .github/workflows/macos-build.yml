name: macOS build

on:
  push:
    branches: [codex/rastro-fx-foundation]
  pull_request:
    # PR #5 is stacked on PR #4 rather than on main.
    branches: [main, codex/nova-visual-on-codex-audio]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AU, VST3 and Standalone (universal)
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      BUILD_DIR: build-macos-ci
      PACKAGE_NAME: ${{ github.event.pull_request.number && format('RASTRO-PR{0}-macOS-universal', github.event.pull_request.number) || 'RASTRO-macOS-universal' }}
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      SOURCE_PR: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Check web editor JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for script in ui/*.js; do node --check "$script"; done

      - name: Configure universal Release build
        run: >-
          cmake -S . -B "$BUILD_DIR" -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DRASTRO_WEB_UI=ON

      - name: Build all Mac formats and DSP tests
        run: >-
          cmake --build "$BUILD_DIR" --config Release
          --target Rastro_AU Rastro_VST3 Rastro_Standalone RastroCapture_AU RastroCapture_VST3 RastroFx_AU RastroFx_VST3
          rastro_tests rastro_character_tests rastro_playback_tests rastro_mp3_tests rastro_synth_tests
          rastro_capture_tests rastro_timing_tests rastro_patch_tests rastro_recording_tests rastro_capture_bridge_tests rastro_fx_tests
          --parallel 3

      - name: Run native DSP, codec, capture and FX tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$BUILD_DIR" -C Release --output-on-failure | tee native-tests.log

      - name: Validate PLAY, Capture and FX VST3s with pluginval 1.0.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_macOS.zip -o "$RUNNER_TEMP/pluginval.zip"
          ditto -x -k "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP/pluginval"
          validator="$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval"
          test -x "$validator"
          "$validator" --strictness-level 5 --random-seed 42 --validate "$PWD/$BUILD_DIR/Rastro_artefacts/Release/VST3/RASTRO.vst3" 2>&1 | tee pluginval-play.log
          "$validator" --strictness-level 5 --random-seed 42 --validate "$PWD/$BUILD_DIR/RastroCapture_artefacts/Release/VST3/RASTRO Capture.vst3" 2>&1 | tee pluginval-capture.log
          "$validator" --strictness-level 5 --random-seed 42 --validate "$PWD/$BUILD_DIR/RastroFx_artefacts/Release/VST3/RASTRO FX.vst3" 2>&1 | tee pluginval-fx.log

      - name: Verify architectures and ad-hoc sign bundles
        shell: bash
        run: |
          set -euo pipefail
          root="$BUILD_DIR/Rastro_artefacts/Release"
          for bundle in "$root/AU/RASTRO.component" "$root/VST3/RASTRO.vst3" "$root/Standalone/RASTRO.app" "$BUILD_DIR/RastroCapture_artefacts/Release/AU/RASTRO Capture.component" "$BUILD_DIR/RastroCapture_artefacts/Release/VST3/RASTRO Capture.vst3" "$BUILD_DIR/RastroFx_artefacts/Release/AU/RASTRO FX.component" "$BUILD_DIR/RastroFx_artefacts/Release/VST3/RASTRO FX.vst3"; do
            executable="$bundle/Contents/MacOS/$(basename "$bundle" | sed 's/\.[^.]*$//')"
            test -f "$executable"
            lipo -archs "$executable"
            lipo "$executable" -verify_arch arm64 x86_64
            codesign --force --sign - --timestamp=none "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Validate PLAY, Capture and FX Audio Units with auval
        shell: bash
        run: |
          set -euo pipefail
          component_dir="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$component_dir"
          ditto "$BUILD_DIR/Rastro_artefacts/Release/AU/RASTRO.component" "$component_dir/RASTRO.component"
          ditto "$BUILD_DIR/RastroCapture_artefacts/Release/AU/RASTRO Capture.component" "$component_dir/RASTRO Capture.component"
          ditto "$BUILD_DIR/RastroFx_artefacts/Release/AU/RASTRO FX.component" "$component_dir/RASTRO FX.component"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents' "$component_dir/RASTRO.component/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents' "$component_dir/RASTRO Capture.component/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents' "$component_dir/RASTRO FX.component/Contents/Info.plist"
          # pluginval may have started the registrar before these AUs were installed.
          # Refresh only this disposable runner's process, then allow discovery to finish.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for attempt in {1..10}; do
            auval -a > au-components.log 2>&1
            if grep -E 'aumu[[:space:]]+Rstr[[:space:]]+GbCa' au-components.log && grep -E 'aufx[[:space:]]+Rcpt[[:space:]]+GbCa' au-components.log && grep -E 'aufx[[:space:]]+Rfx1[[:space:]]+GbCa' au-components.log; then
              break
            fi
            sleep 2
          done
          cat au-components.log
          auval -v aumu Rstr GbCa 2>&1 | tee auval-play.log
          auval -v aufx Rcpt GbCa 2>&1 | tee auval-capture.log
          auval -v aufx Rfx1 GbCa 2>&1 | tee auval-fx.log

      - name: Package bundles with Mac permissions and symlinks
        shell: bash
        run: |
          set -euo pipefail
          root="$BUILD_DIR/Rastro_artefacts/Release"
          package="staging/$PACKAGE_NAME"
          mkdir -p "$package/AU" "$package/VST3" "$package/Standalone" "$package/Previews/FX" dist
          ditto "$root/AU/RASTRO.component" "$package/AU/RASTRO.component"
          ditto "$root/VST3/RASTRO.vst3" "$package/VST3/RASTRO.vst3"
          ditto "$root/Standalone/RASTRO.app" "$package/Standalone/RASTRO.app"
          ditto "$BUILD_DIR/RastroCapture_artefacts/Release/AU/RASTRO Capture.component" "$package/AU/RASTRO Capture.component"
          ditto "$BUILD_DIR/RastroCapture_artefacts/Release/VST3/RASTRO Capture.vst3" "$package/VST3/RASTRO Capture.vst3"
          ditto "$BUILD_DIR/RastroFx_artefacts/Release/AU/RASTRO FX.component" "$package/AU/RASTRO FX.component"
          ditto "$BUILD_DIR/RastroFx_artefacts/Release/VST3/RASTRO FX.vst3" "$package/VST3/RASTRO FX.vst3"
          cp README.md "$package/README.md"
          cp docs/RASTRO-FX.md "$package/RASTRO-FX.md"
          cp "$BUILD_DIR"/fx-editor-*.png "$package/Previews/FX/"
          cp docs/INSTALL-MAC.txt "$package/INSTALL-MAC.txt"
          ditto docs/previews "$package/Previews/Historical-JUCE"
          ditto docs/previews-web "$package/Previews/Web-PR5"
          cp docs/previews-web/PACKAGE-README.txt "$package/Previews/README.txt"
          {
            echo "RASTRO by Gab Calisman"
            echo "Source commit: $SOURCE_COMMIT"
            echo "Source branch: $SOURCE_BRANCH"
            echo "PR: $SOURCE_PR"
            echo "Tested checkout (PR merge commit for PR runs): $(git rev-parse HEAD)"
            echo "Runner architecture: $(uname -m)"
            echo "Bundle architectures: arm64 + x86_64 (verified with lipo)"
            echo "Minimum deployment target: macOS 12.0; Logic has its own OS requirements."
            echo "Built and packaged: PLAY AU/VST3/Standalone + Capture AU/VST3 + FX AU/VST3 (seven bundles). Checks: eleven native suites including FX DSP/state/offscreen editor, CoreAudio M4A and capture IPC passed; PLAY, Capture and FX VST3s passed pluginval 1.0.3 level 5 seed 42; AUs aumu Rstr GbCa, aufx Rcpt GbCa and aufx Rfx1 GbCa passed auval; all seven bundles passed architecture and signature verification."
            echo "Ad-hoc signed for testing; NOT Developer ID signed or notarized."
            echo "Web editor enabled. PR #5 is an unfinished visual draft, not the approved NOVA redesign."
            echo "Previews/Web-PR5: Linux Chromium captures with SIMULATED telemetry; not Mac/WebKit or DSP validation."
            echo "Previews/Historical-JUCE: older native-editor captures; not this web redesign."
            echo "Previews/FX: real offscreen FX editor renders from this native test run; not Logic screenshots."
            echo "Native arm64 execution, hardware audio/MIDI and Logic Pro playback NOT tested."
            sw_vers
            xcodebuild -version
            for binary in "$package"/*/*.*/Contents/MacOS/*; do
              echo "$binary: $(lipo -archs "$binary")"
            done
          } > "$package/BUILD-INFO.txt"
          mkdir -p dist/report
          cp "$package/BUILD-INFO.txt" native-tests.log pluginval-play.log pluginval-capture.log pluginval-fx.log auval-play.log auval-capture.log auval-fx.log au-components.log dist/report/
          ditto -c -k --sequesterRsrc --keepParent "$package" "dist/$PACKAGE_NAME.zip"
          (cd dist && shasum -a 256 "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256")
          cp "dist/$PACKAGE_NAME.zip.sha256" dist/report/
          {
            echo "### Download RASTRO"
            echo "Artifact: **$PACKAGE_NAME** (contains a bundle-preserving ZIP and its SHA-256)."
            echo "Built and packaged PLAY AU/VST3/Standalone + Capture AU/VST3 + FX AU/VST3 (seven bundles) for **arm64 + x86_64**, deployment target macOS 12.0."
            echo "All seven bundles passed architecture/signature checks; ad-hoc signed, not notarized. Eleven native suites passed. PLAY/Capture/FX VST3s passed pluginval 1.0.3 level 5 seed 42; all three AUs passed auval (Rstr/Rcpt/Rfx1, GbCa). No native arm64, Logic Pro or hardware playback test was performed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable Mac ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload small verification report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-build-report
          path: dist/report/
          if-no-files-found: error
          retention-days: 14
